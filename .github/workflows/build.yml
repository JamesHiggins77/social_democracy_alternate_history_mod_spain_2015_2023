name: Build game

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Dendry game
        run: npm run dendrynexus -- make-html --pretty
      - name: Verify generated game files
        run: |
          test -s out/game.json
          test -s out/html/index.html
